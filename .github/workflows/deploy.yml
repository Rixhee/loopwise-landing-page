name: Deploy to Cloudflare Pages

# Every push deploys the site:
#   push to main        -> the live site
#   push to any branch  -> a preview link (shown in the Actions log and on PRs)
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these in GitHub -> Settings -> Secrets and variables -> Actions:$missing (see README, 'Auto-deploy on every push')"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Apply database schema (safe to re-run)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute loopwise --remote --file=schema.sql --yes

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy --project-name=getloopwise --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}

      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
